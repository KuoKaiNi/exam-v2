# 測試用記憶體資料庫，每個測試 context 各自一份，不碰 data/ 底下的正式資料
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1
spring.main.allow-bean-definition-overriding=true
# 測試絕不連真的官方網站：預設指到本機關著的 port，需要時由測試換成假伺服器
app.quote.twse-base-url=http://127.0.0.1:9
app.quote.tpex-base-url=http://127.0.0.1:9
app.quote.min-interval=0s
app.quote.refresh-enabled=false
