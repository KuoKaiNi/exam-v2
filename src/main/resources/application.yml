server:
  port: 8083
spring:
  application:
    name: holdings
  datasource:
    # H2 檔案模式，資料存在專案底下的 data/ 資料夾，不需要另外裝資料庫
    url: jdbc:h2:file:./data/holdings
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

quote:
  # 官方行情網址。驗收時可用環境變數改掉，例如 QUOTE_TWSE_BASE_URL=http://localhost:9000
  twse-base-url: ${QUOTE_TWSE_BASE_URL:https://www.twse.com.tw}
  tpex-base-url: ${QUOTE_TPEX_BASE_URL:https://www.tpex.org.tw}
  # 收盤價快取時間；同一檔在這段時間內不會再向官方查
  cache-ttl: 30m
  # 某個來源連線失敗後，暫停查詢它的時間
  failure-backoff: 3m
  # 對官方連續發出的請求之間至少隔多久
  min-request-interval: 1s
  connect-timeout: 2s
  read-timeout: 3s
  # 新增持股（查上市、上櫃）的總時限
  lookup-deadline: 8s

tax:
  # 被動式債券 ETF（00 開頭、B 結尾）免徵證交稅的最後一天。待確認，見 ISSUES.md
  bond-etf-exempt-until: 2026-12-31
