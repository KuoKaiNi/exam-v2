spring.application.name=holdings
server.port=${PORT:8085}

# 所有日期時間一律以台北時間計算（正式機時區不是台北）
app.time-zone=Asia/Taipei

# 資料庫：H2 檔案模式，檔案在專案下 data/ 資料夾；資料表由 Flyway 建立（src/main/resources/db/migration）
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/holdings}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 官方行情來源。主機部分可用環境變數 TWSE_BASE_URL、TPEX_BASE_URL 換掉，路徑和參數不變
app.quote.twse-base-url=${TWSE_BASE_URL:https://www.twse.com.tw}
app.quote.tpex-base-url=${TPEX_BASE_URL:https://www.tpex.org.tw}
# 官方網站兩次查詢至少隔 3 秒（證交所、櫃買中心共用同一個間隔；改 throttle-per-host=true 則各自計算）
app.quote.min-interval=3s
app.quote.throttle-per-host=false
app.quote.connect-timeout=3s
app.quote.request-timeout=4s
# 新增持股時查代號的總時限（題目要求 10 秒內有結果）
app.quote.lookup-deadline=9s
# 背景更新：每 1 分鐘檢查一次，收盤價不是最新的、而且距上次查超過 10 分鐘才查官方
app.quote.refresh-enabled=true
app.quote.refresh-interval=1m
app.quote.recheck-interval=10m
# 官方網站出錯後，背景更新暫停查它 5 分鐘
app.quote.error-cooldown=5m
# 預期交易日 18:00（台北）後還查不到當天資料，當作休市
app.quote.given-up-after=18:00

# 回應一律標明 UTF-8（API 規格：JSON、UTF-8）
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true
