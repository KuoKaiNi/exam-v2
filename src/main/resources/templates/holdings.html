<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>持股清單｜持股記帳</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 16px; color: #222; }
        table { border-collapse: collapse; width: 100%; max-width: 720px; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
        .error { color: #b00020; font-weight: bold; }
        form.inline { display: inline; }
        input { padding: 6px; }
        .gain { color: #d32f2f; }
        .loss { color: #2e7d32; }
        .summary { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; max-width: 720px; }
        .summary .big { font-size: 1.6em; font-weight: bold; }
        .muted { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <p><a href="/">首頁</a></p>
    <h1>持股清單</h1>

    <p class="error" th:if="${error != null}" th:text="${error}">錯誤訊息</p>

    <form method="post" action="/holdings">
        <h2>新增持股</h2>
        <label>股票代號 <input name="code" th:value="${form.code()}" required></label>
        <label>張數（1 張 = 1,000 股） <input name="lots" th:value="${form.lots()}" required></label>
        <label>買進價（每股） <input name="buyPrice" th:value="${form.buyPrice()}" required></label>
        <button type="submit">新增</button>
    </form>

    <section class="summary" th:unless="${holdings.isEmpty()}">
        <div>總計盈虧（扣手續費與證交稅）</div>
        <div class="big" th:classappend="${summary.pnl() > 0 ? 'gain' : (summary.pnl() < 0 ? 'loss' : '')}"
             th:text="${(summary.pnl() > 0 ? '+' : '') + #numbers.formatInteger(summary.pnl(), 1, 'COMMA') + ' 元　' + #numbers.formatDecimal(summary.returnPct(), 1, 'COMMA', 2, 'POINT') + '%'}">+0 元</div>
        <div class="muted">
            總成本 <span th:text="${#numbers.formatInteger(summary.totalCost(), 1, 'COMMA')}">0</span> 元，
            市值 <span th:text="${#numbers.formatInteger(summary.marketValue(), 1, 'COMMA')}">0</span> 元
            <span th:if="${summary.quoteMissing() > 0}">，有 <span th:text="${summary.quoteMissing()}">1</span> 筆收盤價未取得，未計入市值與盈虧</span>
        </div>
    </section>

    <h2>我的持股</h2>
    <p th:if="${holdings.isEmpty()}">還沒有持股。</p>
    <table th:unless="${holdings.isEmpty()}">
        <thead>
            <tr><th>代號</th><th>名稱</th><th>市場</th><th>張數</th><th>買進價</th><th>收盤價</th><th>盈虧</th><th>收益率</th><th>操作</th></tr>
        </thead>
        <tbody>
            <tr th:each="h : ${holdings}">
                <td th:text="${h.code()}">2330</td>
                <td th:text="${h.name()}">台積電</td>
                <td th:text="${h.market().label()}">上市</td>
                <td th:text="${h.lots()}">1</td>
                <td th:text="${#numbers.formatDecimal(h.buyPrice(), 1, 'COMMA', 2, 'POINT')}">1,000.00</td>
                <td>
                    <span th:if="${h.currentPrice() != null}"
                          th:text="${#numbers.formatDecimal(h.currentPrice(), 1, 'COMMA', 2, 'POINT') + '（' + #temporals.format(h.priceDate(), 'MM-dd') + '）'}">2,350.00</span>
                    <span th:if="${h.currentPrice() == null}">未取得</span>
                </td>
                <td th:classappend="${h.pnl() == null ? '' : (h.pnl() > 0 ? 'gain' : (h.pnl() < 0 ? 'loss' : ''))}">
                    <span th:if="${h.pnl() != null}"
                          th:text="${(h.pnl() > 0 ? '+' : '') + #numbers.formatInteger(h.pnl(), 1, 'COMMA')}">+0</span>
                    <span th:if="${h.pnl() == null}" class="muted">未取得</span>
                </td>
                <td th:classappend="${h.pnl() == null ? '' : (h.pnl() > 0 ? 'gain' : (h.pnl() < 0 ? 'loss' : ''))}">
                    <span th:if="${h.returnPct() != null}"
                          th:text="${(h.pnl() > 0 ? '+' : '') + #numbers.formatDecimal(h.returnPct(), 1, 'COMMA', 2, 'POINT') + '%'}">+0.00%</span>
                    <span th:if="${h.returnPct() == null}" class="muted">未取得</span>
                </td>
                <td>
                    <a th:href="@{/holdings/{id}/edit(id=${h.id()})}">修改</a>
                    <form class="inline" method="post" th:action="@{/holdings/{id}/delete(id=${h.id()})}"
                          onsubmit="return confirm('確定要刪除這筆持股？');">
                        <button type="submit">刪除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
