<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>持股清單｜持股記帳</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 16px; color: #222; }
        table { border-collapse: collapse; width: 100%; max-width: 980px; }
        th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; white-space: nowrap; }
        .error { color: #b00020; font-weight: bold; }
        .gain { color: #d32f2f; }
        .loss { color: #2e7d32; }
        .muted { color: #666; font-size: 0.9em; }
        .summary { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; max-width: 980px; }
        .summary .big { font-size: 1.6em; font-weight: bold; }
        input, select { padding: 6px; margin-right: 6px; }
    </style>
</head>
<body>
    <p><a href="/">首頁</a></p>
    <h1>持股清單</h1>

    <p class="error" th:if="${error != null}" th:text="${error}">錯誤訊息</p>

    <section class="summary" th:unless="${positions.isEmpty()}">
        <div>未實現損益（扣手續費與證交稅，依最近收盤價）</div>
        <div class="big" th:classappend="${totals.unrealizedPnl() > 0 ? 'gain' : (totals.unrealizedPnl() < 0 ? 'loss' : '')}"
             th:text="${(totals.unrealizedPnl() > 0 ? '+' : '') + #numbers.formatInteger(totals.unrealizedPnl(), 1, 'COMMA') + ' 元　' + #numbers.formatDecimal(totals.unrealizedReturnPct(), 1, 'COMMA', 2, 'POINT') + '%'}">+0 元</div>
        <div class="muted">
            剩餘成本（含買進手續費）<span th:text="${#numbers.formatInteger(totals.costBasis(), 1, 'COMMA')}">0</span> 元，
            市值 <span th:text="${#numbers.formatInteger(totals.marketValue(), 1, 'COMMA')}">0</span> 元，
            已實現損益 <span th:classappend="${totals.realizedPnl() > 0 ? 'gain' : (totals.realizedPnl() < 0 ? 'loss' : '')}"
                th:text="${(totals.realizedPnl() > 0 ? '+' : '') + #numbers.formatInteger(totals.realizedPnl(), 1, 'COMMA')}">0</span> 元
            <span th:if="${totals.quoteMissing() > 0}">，有 <span th:text="${totals.quoteMissing()}">1</span> 檔收盤價未取得，未計入市值與未實現損益</span>
        </div>
    </section>

    <h2>新增持股（第一筆買進）</h2>
    <form method="post" action="/holdings">
        <input name="code" placeholder="代號，例如 2330" required>
        <input name="tradeDate" type="date" th:attr="max=${today}" required>
        <input name="shares" placeholder="股數（1 張 = 1000 股）" required>
        <input name="price" placeholder="買進價（每股）" required>
        <button type="submit">新增</button>
    </form>

    <h2>我的持股</h2>
    <p th:if="${positions.isEmpty()}">還沒有持股。</p>
    <table th:unless="${positions.isEmpty()}">
        <thead>
            <tr>
                <th>代號</th><th>名稱</th><th>市場</th><th>持有</th><th>成交均價</th><th>含費均價</th>
                <th>收盤價</th><th>未實現損益</th><th>收益率</th><th>已實現損益</th><th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${positions}">
                <td th:text="${p.code()}">2330</td>
                <td th:text="${p.name()}">台積電</td>
                <td th:text="${p.market().label()}">上市</td>
                <td th:text="${T(com.example.holdings.domain.Shares).format(p.shares())}">1 張</td>
                <td th:text="${p.avgPrice() == null ? '-' : #numbers.formatDecimal(p.avgPrice(), 1, 'COMMA', 2, 'POINT')}">-</td>
                <td th:text="${p.avgCost() == null ? '-' : #numbers.formatDecimal(p.avgCost(), 1, 'COMMA', 2, 'POINT')}">-</td>
                <td>
                    <span th:if="${p.currentPrice() != null}"
                          th:text="${#numbers.formatDecimal(p.currentPrice(), 1, 'COMMA', 2, 'POINT') + '（' + #temporals.format(p.priceDate(), 'MM-dd') + '）'}">2,175.00</span>
                    <span th:if="${p.currentPrice() == null and p.shares() > 0}" class="muted">未取得</span>
                    <span th:if="${p.shares() == 0}" class="muted">已全部賣出</span>
                </td>
                <td th:classappend="${p.unrealizedPnl() == null ? '' : (p.unrealizedPnl() > 0 ? 'gain' : (p.unrealizedPnl() < 0 ? 'loss' : ''))}">
                    <span th:if="${p.unrealizedPnl() != null}"
                          th:text="${(p.unrealizedPnl() > 0 ? '+' : '') + #numbers.formatInteger(p.unrealizedPnl(), 1, 'COMMA')}">+0</span>
                    <span th:if="${p.shares() > 0 and p.unrealizedPnl() == null}" class="muted">未取得</span>
                </td>
                <td th:classappend="${p.unrealizedPnl() == null ? '' : (p.unrealizedPnl() > 0 ? 'gain' : (p.unrealizedPnl() < 0 ? 'loss' : ''))}">
                    <span th:if="${p.unrealizedReturnPct() != null}"
                          th:text="${(p.unrealizedPnl() > 0 ? '+' : '') + #numbers.formatDecimal(p.unrealizedReturnPct(), 1, 'COMMA', 2, 'POINT') + '%'}">+0.00%</span>
                </td>
                <td th:classappend="${p.realizedPnl() > 0 ? 'gain' : (p.realizedPnl() < 0 ? 'loss' : '')}"
                    th:text="${(p.realizedPnl() > 0 ? '+' : '') + #numbers.formatInteger(p.realizedPnl(), 1, 'COMMA')}">0</td>
                <td><a th:href="@{/holdings/{id}(id=${p.id()})}">明細</a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
